<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sketch River Flow</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #fdf6e3; /* Paper color */
            font-family: 'Courier New', Courier, monospace;
        }
        canvas { display: block; }

        /* Audio Button Style */
        #audio-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(44, 62, 80, 0.1);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
            z-index: 100;
        }
        #audio-btn:hover {
            background: rgba(44, 62, 80, 0.2);
        }
        #audio-btn svg {
            width: 24px;
            height: 24px;
            fill: #2c3e50;
        }
    </style>
</head>
<body>
    <!-- Audio Controls -->
    <div id="audio-btn" title="Toggle Nature Sounds">
        <!-- Default: Muted Icon -->
        <svg id="icon-muted" viewBox="0 0 24 24">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
        </svg>
        <!-- Playing Icon (Hidden by default) -->
        <svg id="icon-playing" viewBox="0 0 24 24" style="display: none;">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
    </div>

    <!-- Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- Configuration ---
        const CONFIG = {
            colors: {
                background: 0xfdf6e3,
                inkMain: 0x2c3e50,
                inkLight: 0x93a1a1,
                inkAccent: 0x268bd2,
                rockColor: 0x8899a6,
                rockOutline: 0x2c3e50
            },
            speed: 0.002, 
            riverWidth: 4,
            curveDivisions: 300,
            interactionRadius: 3.0,
            interactionStrength: 0.5 
        };

        // --- Audio System ---
        class AudioManager {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.riverNode = null;
                this.isMuted = true;
                this.isPlaying = false;
            }

            init() {
                if (this.ctx) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0;
                this.masterGain.connect(this.ctx.destination);

                this.setupRiverSound();
                this.setupBirdLoop();
                this.isPlaying = true;
            }

            setupRiverSound() {
                // Create Brown/Pink noise buffer for water texture
                const bufferSize = 2 * this.ctx.sampleRate;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                let lastOut = 0;
                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    data[i] = (lastOut + (0.02 * white)) / 1.02; 
                    lastOut = data[i];
                    data[i] *= 3.5; 
                }

                this.riverNode = this.ctx.createBufferSource();
                this.riverNode.buffer = buffer;
                this.riverNode.loop = true;

                // Lowpass filter for "underwater/flow" sound
                this.riverFilter = this.ctx.createBiquadFilter();
                this.riverFilter.type = 'lowpass';
                this.riverFilter.frequency.value = 400;

                // Gain for modulation
                this.riverGain = this.ctx.createGain();
                this.riverGain.gain.value = 0.3;

                this.riverNode.connect(this.riverFilter);
                this.riverFilter.connect(this.riverGain);
                this.riverGain.connect(this.masterGain);
                this.riverNode.start(0);
            }

            setupBirdLoop() {
                // Randomly trigger bird sounds
                const triggerBird = () => {
                    if (!this.isMuted && Math.random() > 0.6) {
                        this.playBirdSound();
                    }
                    setTimeout(triggerBird, 2000 + Math.random() * 5000);
                };
                triggerBird();
            }

            playBirdSound() {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                // Bird chirp: Sine wave starting high and dropping slightly
                osc.type = 'sine';
                const startFreq = 2000 + Math.random() * 1500;
                osc.frequency.setValueAtTime(startFreq, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(startFreq * 0.8, this.ctx.currentTime + 0.1);

                gain.gain.setValueAtTime(0, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.1, this.ctx.currentTime + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(this.masterGain);
                
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            toggle() {
                if (!this.ctx) {
                    this.init();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                
                this.isMuted = !this.isMuted;
                
                // Fade in/out
                const target = this.isMuted ? 0 : 0.5;
                this.masterGain.gain.setTargetAtTime(target, this.ctx.currentTime, 0.1);

                return this.isMuted;
            }

            // Modulate river sound based on mouse interaction
            updateInteraction(intensity) {
                if (this.isMuted || !this.riverFilter) return;
                // Open up the filter and increase volume slightly when touching
                const targetFreq = 400 + (intensity * 800);
                const targetGain = 0.3 + (intensity * 0.2);
                
                this.riverFilter.frequency.setTargetAtTime(targetFreq, this.ctx.currentTime, 0.1);
                this.riverGain.gain.setTargetAtTime(targetGain, this.ctx.currentTime, 0.1);
            }
        }

        // --- Global Variables ---
        let scene, camera, renderer;
        let birds = []; 
        let waterStrokes = []; 
        let time = 0;
        let mainCurvePath; 
        
        const audioManager = new AudioManager();

        // Interaction globals
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(-100, -100); 
        const interactionPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        let mouseProjected = new THREE.Vector3(0, 0, 0);

        // --- Initialization ---
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(CONFIG.colors.background);
            scene.fog = new THREE.FogExp2(CONFIG.colors.background, 0.02);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 3.5, 9); 
            camera.lookAt(0, 0, -12);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
            scene.add(ambientLight);

            // Build Scene
            createRiverSystem(); 
            createLandscape();
            createAbstractRocks(); 
            createVerticalShrubs(); 
            createBirds();
            createPaperTextureOverlay(); 

            // Events
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            
            // Audio Button
            const btn = document.getElementById('audio-btn');
            const iconMuted = document.getElementById('icon-muted');
            const iconPlaying = document.getElementById('icon-playing');

            btn.addEventListener('click', () => {
                const isMuted = audioManager.toggle();
                if (isMuted) {
                    iconMuted.style.display = 'block';
                    iconPlaying.style.display = 'none';
                } else {
                    iconMuted.style.display = 'none';
                    iconPlaying.style.display = 'block';
                }
            });

            animate();
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        // --- River System ---
        function createRiverSystem() {
            const mainPoints = [
                new THREE.Vector3(0, 0, 10),
                new THREE.Vector3(0.5, 0, 5),
                new THREE.Vector3(-1.5, 0, -2),
                new THREE.Vector3(2.0, 0, -15),
                new THREE.Vector3(-1.0, 0, -30),
                new THREE.Vector3(0, 0, -60)
            ];
            mainCurvePath = new THREE.CatmullRomCurve3(mainPoints);

            const pathCount = 28;
            const parallelPaths = [];

            for (let i = 0; i < pathCount; i++) {
                const t = (i / (pathCount - 1)) * 2 - 1; 
                const offsetPoints = mainPoints.map(p => {
                    const widthAtDepth = CONFIG.riverWidth + (Math.abs(p.z) * 0.1); 
                    const jitterX = (Math.random() - 0.5) * 0.5; 
                    return new THREE.Vector3(
                        p.x + (t * widthAtDepth * 0.5) + jitterX,
                        p.y,
                        p.z
                    );
                });
                parallelPaths.push(new THREE.CatmullRomCurve3(offsetPoints));
            }

            const strokesPerPath = 10; 
            const pointsPerStroke = 5; 

            parallelPaths.forEach((path, pathIndex) => {
                for(let j=0; j<strokesPerPath; j++) {
                    const startT = Math.random(); 
                    
                    const geometry = new THREE.BufferGeometry();
                    const positions = new Float32Array(pointsPerStroke * 3);
                    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

                    const material = new THREE.LineBasicMaterial({
                        color: Math.abs(pathIndex - pathCount/2) < 5 ? CONFIG.colors.inkAccent : CONFIG.colors.inkMain,
                        opacity: 0.6 + Math.random() * 0.4,
                        transparent: true,
                        linewidth: 1
                    });

                    const stroke = new THREE.Line(geometry, material);
                    stroke.frustumCulled = false;
                    scene.add(stroke);

                    waterStrokes.push({
                        mesh: stroke,
                        path: path,
                        currentT: startT,
                        speed: CONFIG.speed * (0.8 + Math.random() * 0.4), 
                        length: 0.06 + Math.random() * 0.06,
                        curveNoise: Math.random() * 100, 
                        pathIndex: pathIndex
                    });
                }
            });

            const createSketchyBank = (side) => { 
                const numPasses = 3;
                for(let k=0; k<numPasses; k++) {
                    const bankPoints = mainPoints.map(p => {
                        const widthAtDepth = CONFIG.riverWidth + (Math.abs(p.z) * 0.1);
                        return new THREE.Vector3(
                            p.x + (side * widthAtDepth * 0.6) + (Math.random()-0.5)*0.5, 
                            0.1 + Math.random() * 0.1, 
                            p.z
                        );
                    });
                    const curve = new THREE.CatmullRomCurve3(bankPoints);
                    const points = curve.getPoints(100);
                    const geometry = new THREE.BufferGeometry().setFromPoints(points);
                    const material = new THREE.LineBasicMaterial({ 
                        color: CONFIG.colors.inkMain, 
                        opacity: 0.5, 
                        transparent: true 
                    });
                    scene.add(new THREE.Line(geometry, material));
                }
            };
            createSketchyBank(1);
            createSketchyBank(-1);
        }

        // --- Abstract 2D Rocks ---
        function createAbstractRocks() {
            const numRocks = 6;
            for(let i=0; i<numRocks; i++) {
                let pos = new THREE.Vector3();
                let isLand = (i === 0); 
                
                const t = 0.05 + Math.random() * 0.7; 
                const pointOnPath = mainCurvePath.getPoint(t);
                const widthAtDepth = CONFIG.riverWidth + (Math.abs(pointOnPath.z) * 0.1);

                if (isLand) {
                    const side = Math.random() > 0.5 ? 1 : -1;
                    const offset = (widthAtDepth * 0.7) + 1 + Math.random() * 3;
                    pos.set(pointOnPath.x + (side * offset), 0.05, pointOnPath.z);
                } else {
                    const offset = (Math.random() - 0.5) * widthAtDepth * 0.8;
                    pos.set(pointOnPath.x + offset, 0.02, pointOnPath.z); 
                }

                const shape = new THREE.Shape();
                const numPoints = 6 + Math.floor(Math.random() * 4);
                const radius = 0.2 + Math.random() * 0.5;
                const points = [];

                for (let j = 0; j < numPoints; j++) {
                    const angle = (j / numPoints) * Math.PI * 2;
                    const r = radius * (0.6 + Math.random() * 0.8);
                    points.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r });
                }
                
                shape.moveTo(points[0].x, points[0].y);
                for(let j=1; j<points.length; j++) {
                    shape.lineTo(points[j].x, points[j].y);
                }
                shape.lineTo(points[0].x, points[0].y);

                const geometry = new THREE.ShapeGeometry(shape);
                const material = new THREE.MeshBasicMaterial({ 
                    color: CONFIG.colors.rockColor,
                    side: THREE.DoubleSide
                });

                const mesh = new THREE.Mesh(geometry, material);
                mesh.rotation.x = -Math.PI / 2; 
                mesh.position.copy(pos);
                mesh.rotation.z = Math.random() * Math.PI * 2; 

                const edges = new THREE.EdgesGeometry(geometry);
                const lineMat = new THREE.LineBasicMaterial({ color: CONFIG.colors.rockOutline, linewidth: 1 });
                const outline = new THREE.LineSegments(edges, lineMat);
                mesh.add(outline);

                scene.add(mesh);
            }
        }

        // --- Shrubs ---
        function createVerticalShrubs() {
            const numShrubClusters = 15;
            for(let i=0; i<numShrubClusters; i++) {
                const side = Math.random() > 0.5 ? 1 : -1;
                const t = Math.random() * 0.9; 
                const pointOnPath = mainCurvePath.getPoint(t);
                const widthAtDepth = CONFIG.riverWidth + (Math.abs(pointOnPath.z) * 0.1);
                const bankX = pointOnPath.x + (side * widthAtDepth * 0.85); 
                
                const center = new THREE.Vector3(bankX + (Math.random() * 2 * side), 0, pointOnPath.z);

                const positions = [];
                const count = 12;
                const radius = 0.5;

                for(let j=0; j<count; j++) {
                    const angle = Math.random() * Math.PI * 2;
                    const r = Math.random() * radius;
                    const lx = center.x + Math.cos(angle) * r;
                    const lz = center.z + Math.sin(angle) * r;
                    const h = 0.3 + Math.random() * 0.4; 
                    
                    positions.push(lx, 0, lz);
                    positions.push(lx + (Math.random()-0.5)*0.15, h, lz);
                }

                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                const mat = new THREE.LineBasicMaterial({ color: CONFIG.colors.inkMain, opacity: 0.6, transparent: true });
                scene.add(new THREE.LineSegments(geo, mat));
            }
        }

        function createBirds() {
            const numBirds = 5;
            for(let i=0; i<numBirds; i++) {
                const geometry = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(-0.2, 0, 0),
                    new THREE.Vector3(0, -0.1, 0),
                    new THREE.Vector3(0.2, 0, 0)
                ]);
                const material = new THREE.LineBasicMaterial({ color: CONFIG.colors.inkMain });
                const bird = new THREE.Line(geometry, material);
                
                bird.position.set(2 + Math.random()*4, 4 + Math.random()*2, -10 - Math.random()*10);
                bird.userData = { speed: 0.02 + Math.random()*0.01, yOffset: Math.random()*100 };
                scene.add(bird);
                birds.push(bird);
            }
        }

        function createLandscape() {
            const groundLines = 25;
            for (let i = 0; i < groundLines; i++) {
                const z = 5 - (i * (60 / groundLines)); 
                const lPoints = [];
                for(let x = -20; x < -2; x+=0.5) lPoints.push(new THREE.Vector3(x, Math.sin(x*0.5+z*0.2)*0.5, z));
                if(lPoints.length>1) scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(lPoints), new THREE.LineBasicMaterial({ color: CONFIG.colors.inkLight, transparent: true, opacity: 0.3 })));
                
                const rPoints = [];
                for(let x = 2; x < 20; x+=0.5) rPoints.push(new THREE.Vector3(x, Math.sin(x*0.5+z*0.2)*0.5, z));
                if(rPoints.length>1) scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(rPoints), new THREE.LineBasicMaterial({ color: CONFIG.colors.inkLight, transparent: true, opacity: 0.3 })));
            }
        }

        function createPaperTextureOverlay() {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            for ( let i = 0; i < 2000; i ++ ) {
                const x = (Math.random() - 0.5) * 40;
                const y = (Math.random() - 0.5) * 20;
                const z = (Math.random() - 0.5) * 20; 
                if (z > 5) continue;
                vertices.push( x, y, z );
            }
            geometry.setAttribute( 'position', new THREE.Float32BufferAttribute( vertices, 3 ) );
            const particles = new THREE.Points( geometry, new THREE.PointsMaterial({ color: 0x8b7e66, size: 0.02, opacity: 0.3, transparent: true }));
            scene.add( particles );
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // --- Update Mouse Interaction ---
            raycaster.setFromCamera(mouse, camera);
            const intersects = new THREE.Vector3();
            raycaster.ray.intersectPlane(interactionPlane, intersects);
            if(intersects) {
                mouseProjected.copy(intersects);
            }

            // Calculate Max Interaction
            let maxInteraction = 0;

            // --- Animate Water Strokes ---
            waterStrokes.forEach(stroke => {
                // Move forward
                stroke.currentT += stroke.speed;
                if (stroke.currentT > 1) stroke.currentT = 0;

                let t1 = stroke.currentT;
                let t2 = stroke.currentT + stroke.length;
                if(t2 > 1) t2 = 1; 

                const positions = stroke.mesh.geometry.attributes.position.array;
                const numPoints = positions.length / 3;

                const strokeCenter = stroke.path.getPoint(stroke.currentT + stroke.length/2);
                const dx = strokeCenter.x - mouseProjected.x;
                const dz = strokeCenter.z - mouseProjected.z;
                const dist = Math.sqrt(dx*dx + dz*dz);
                
                let interactFactor = 0;
                if (dist < CONFIG.interactionRadius) {
                    interactFactor = (1 - (dist / CONFIG.interactionRadius)) * CONFIG.interactionStrength;
                    if (interactFactor > maxInteraction) maxInteraction = interactFactor;
                }

                for(let k=0; k<numPoints; k++) {
                    const subT = t1 + (k / (numPoints - 1)) * (t2 - t1);
                    const p = stroke.path.getPoint(subT);

                    const noiseFreq = 20.0;
                    const noiseAmp = 0.05;
                    const wiggleX = Math.sin(subT * noiseFreq + stroke.curveNoise + time) * noiseAmp;
                    const wiggleZ = Math.cos(subT * noiseFreq + stroke.curveNoise + time * 0.5) * noiseAmp;

                    const touchWiggleX = Math.sin(k * 2 + time * 15) * interactFactor * 0.4;
                    const touchWiggleZ = Math.cos(k * 2 + time * 15) * interactFactor * 0.4;

                    positions[k*3] = p.x + wiggleX + touchWiggleX;
                    positions[k*3 + 1] = p.y;
                    positions[k*3 + 2] = p.z + wiggleZ + touchWiggleZ;
                }
                
                stroke.mesh.geometry.attributes.position.needsUpdate = true;
            });
            
            // Update Audio based on interaction
            audioManager.updateInteraction(maxInteraction);

            // Birds
            birds.forEach(bird => {
                bird.position.z -= bird.userData.speed;
                bird.scale.y = Math.sin(time * 10 + bird.userData.yOffset);
                if(bird.position.z < -40) bird.position.z = 5;
            });

            // Camera
            camera.position.y = 3.5 + Math.sin(time * 0.5) * 0.05;
            camera.lookAt(0, 0, -12);

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
